  <!-- Audio Tone Synthesizer for PBX Ringback & Keypad Clicks -->
  <script>
    // Web Audio API context for zero-latency audio feedback
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playTone(freq1, freq2, durationMs = 100) {
      try {
        const ctx = getAudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.frequency.value = freq1;
        osc2.frequency.value = freq2;
        gain.gain.value = 0.08;

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start();
        osc2.start();
        setTimeout(() => {
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
          setTimeout(() => { osc1.stop(); osc2.stop(); }, 60);
        }, durationMs);
      } catch(e) {}
    }

    // Standard DTMF Frequencies
    const DTMF_FREQS = {
      '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
      '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
      '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
      '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
    };
  </script>

    let isCallActive = false;
    let isMuted = false;
    let callTimerInterval = null;
    let callSeconds = 0;
    let selectedCallerId = '+18398676637'; // Honey AI Default
    let currentUser = null;

    // Check Auth State on Boot
    function verifyAuthentication() {
      const token = localStorage.getItem('rhive_auth_token');
      const userStr = localStorage.getItem('rhive_user');
      if (!token || !userStr) {
        console.warn('[Auth] No active session, redirecting to /login');
        window.location.href = '/login';
        return false;
      }
      try {
        currentUser = JSON.parse(userStr);
        document.getElementById('userEmailBadge').textContent = currentUser.email || 'michael@rhiveconstruction.com';
        return true;
      } catch(e) {
        window.location.href = '/login';
        return false;
      }
    }

    function handleSignOut() {
      if (confirm('Sign out of RHIVE Telephony?')) {
        if (activeCall) activeCall.disconnect();
        if (twilioDevice) twilioDevice.destroy();
        localStorage.removeItem('rhive_auth_token');
        localStorage.removeItem('rhive_user');
        window.location.href = '/login';
      }
    }

    // Switch between Honey AI and Open Voice line
    function selectCallerId(phone) {
      selectedCallerId = phone;
      const honeyBtn = document.getElementById('cidHoneyBtn');
      const openBtn = document.getElementById('cidOpenBtn');
      if (phone === '+18398676637') {
        honeyBtn.className = 'px-2.5 py-1 rounded-[10px] bg-white text-slate-900 shadow-sm transition';
        openBtn.className = 'px-2.5 py-1 rounded-[10px] text-slate-500 hover:text-slate-900 transition';
      } else {
        openBtn.className = 'px-2.5 py-1 rounded-[10px] bg-white text-slate-900 shadow-sm transition';
        honeyBtn.className = 'px-2.5 py-1 rounded-[10px] text-slate-500 hover:text-slate-900 transition';
      }
      console.log('[Caller ID Selected]', selectedCallerId);
    }

    // Update Device Status Badge
    function setDeviceStatus(text, color = 'emerald') {
      const badge = document.getElementById('deviceStatusIndicator');
      const txt = document.getElementById('deviceStatusText');
      txt.textContent = text;
      if (color === 'emerald') {
        badge.className = 'flex items-center space-x-1 px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-50 text-emerald-700 border border-emerald-200';
      } else if (color === 'amber') {
        badge.className = 'flex items-center space-x-1 px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-amber-50 text-amber-700 border border-amber-200';
      } else {
        badge.className = 'flex items-center space-x-1 px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-rose-50 text-rose-700 border border-rose-200';
      }
    }

    // Initialize Twilio Voice Device
    async function initTwilioVoice() {
      try {
        setDeviceStatus('REGISTERING', 'amber');
        const identity = currentUser?.email?.replace(/[^a-zA-Z0-9_-]/g, '_') || 'michael_web_softphone';
        const res = await fetch(`/api/telephony/token?identity=${identity}`);
        const data = await res.json();

        if (!data.success || !data.token) {
          throw new Error(data.error || 'Failed to retrieve voice access token');
        }

        // Initialize Twilio.Device (v2.x)
        if (typeof Twilio === 'undefined' || !Twilio.Device) {
          throw new Error('Twilio Voice SDK failed to load');
        }

        twilioDevice = new Twilio.Device(data.token, {
          codecPreferences: ['opus', 'pcmu'],
          enableRingingState: true
        });

        twilioDevice.on('registered', () => {
          console.log('[Twilio Voice WebRTC] Device successfully registered and ready.');
          setDeviceStatus('SOVEREIGN VOIP READY', 'emerald');
        });

        twilioDevice.on('error', (twErr) => {
          console.error('[Twilio Device Error]', twErr);
          setDeviceStatus('VOIP ERROR', 'rose');
        });

        twilioDevice.on('tokenWillExpire', async () => {
          console.log('[Twilio Device] Refreshing token before expiry...');
          const refRes = await fetch(`/api/telephony/token?identity=${identity}`);
          const refData = await refRes.json();
          if (refData.token) twilioDevice.updateToken(refData.token);
        });

        await twilioDevice.register();

      } catch (err) {
        console.error('[Twilio Init Failure]', err.message);
        setDeviceStatus('FALLBACK BRIDGE', 'amber');
      }
    }

    // Keypad Digit Input
    function pressDigit(digit) {
      const input = document.getElementById('dialerInput');
      input.value += digit;
      
      // Play audio feedback
      if (DTMF_FREQS[digit]) {
        playTone(DTMF_FREQS[digit][0], DTMF_FREQS[digit][1], 120);
      }

      // If call is active, send DTMF directly to remote phone tree
      if (activeCall) {
        try {
          activeCall.sendDigits(digit);
          console.log('[DTMF Sent to Active Call]', digit);
        } catch(e) {}
      }
    }

    function handleBackspace() {
      const input = document.getElementById('dialerInput');
      input.value = input.value.slice(0, -1);
    }

    // Toggle Calling / Hanging Up
    async function handleCallToggle() {
      if (isCallActive) {
        endCall();
      } else {
        startCall();
      }
    }

    async function startCall() {
      const input = document.getElementById('dialerInput');
      let target = input.value.trim();
      if (!target) {
        alert('Please enter a phone number to call');
        return;
      }

      // Clean number
      target = target.replace(/[^\d+]/g, '');
      if (target.length === 10 && !target.startsWith('+')) {
        target = '+1' + target;
      } else if (target.length === 11 && target.startsWith('1')) {
        target = '+' + target;
      }

      // Ensure AudioContext is ready for in-ear ringback & audio
      getAudioCtx();

      updateCallUIState('dialing');

      // Attempt sovereign WebRTC call first
      if (twilioDevice && twilioDevice.state === 'registered') {
        try {
          console.log(`[VoIP Call Initiating] To=${target}, CallerId=${selectedCallerId}`);
          activeCall = await twilioDevice.connect({
            params: {
              To: target,
              callerId: selectedCallerId
            }
          });

          activeCall.on('ringing', (hasEarlyMedia) => {
            console.log('[VoIP Ringing] Remote party phone is ringing. Playing in-ear audio.');
            updateCallUIState('ringing');
          });

          activeCall.on('accept', () => {
            console.log('[VoIP Accepted] Customer answered! Live 2-way audio established.');
            updateCallUIState('connected');
          });

          activeCall.on('disconnect', () => {
            console.log('[VoIP Disconnect] Call terminated by either carrier or local hangup.');
            resetCallUIState();
          });

          activeCall.on('error', (callErr) => {
            console.error('[VoIP Call Error]', callErr);
            alert('Call error: ' + (callErr.message || 'Carrier connection failed'));
            resetCallUIState();
          });

          return;
        } catch (webrtcErr) {
          console.error('[WebRTC Connect Error]', webrtcErr.message);
        }
      }

      // Graceful fallback to cellular bridge if microphone permission denied
      console.warn('[VoIP] Falling back to backend bridge...');
      try {
        const res = await fetch('/api/mobile/call/bridge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to: target,
            callerId: selectedCallerId,
            bridgeTo: currentUser?.email?.includes('kara') ? '+18014410024' : '+18014491451'
          })
        });
        const data = await res.json();
        if (data.success) {
          updateCallUIState('connected');
        } else {
          alert('Call failed: ' + (data.error || 'Server error'));
          resetCallUIState();
        }
      } catch (bridgeErr) {
        alert('Call failed: ' + bridgeErr.message);
        resetCallUIState();
      }
    }

    function endCall() {
      if (activeCall) {
        try {
          activeCall.disconnect();
        } catch(e) {}
        activeCall = null;
      }
      resetCallUIState();
    }

    function toggleMute() {
      if (!activeCall) return;
      isMuted = !isMuted;
      activeCall.mute(isMuted);
      const muteBtn = document.getElementById('muteBtn');
      if (isMuted) {
        muteBtn.className = 'w-14 h-14 rounded-[14px] bg-rose-500 text-white flex items-center justify-center transition border border-rose-600 shadow-md';
      } else {
        muteBtn.className = 'w-14 h-14 rounded-[14px] bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition border border-slate-200';
      }
    }

    function updateCallUIState(state) {
      isCallActive = true;
      const callBtn = document.getElementById('mainCallBtn');
      const callText = document.getElementById('callBtnText');
      const badge = document.getElementById('callStateBadge');
      const timer = document.getElementById('callTimer');

      if (state === 'dialing' || state === 'ringing') {
        callBtn.className = 'flex-1 max-w-[200px] h-14 sm:h-16 rounded-[16px] bg-rose-500 hover:bg-rose-600 text-white font-mono font-bold text-base tracking-wider flex items-center justify-center space-x-2 shadow-lg transition transform active:scale-95';
        callText.textContent = 'HANG UP';
        badge.textContent = state === 'ringing' ? 'RINGING CUSTOMER...' : 'CONNECTING VOIP...';
        badge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-amber-100 text-amber-800 animate-pulse';
      } else if (state === 'connected') {
        callBtn.className = 'flex-1 max-w-[200px] h-14 sm:h-16 rounded-[16px] bg-rose-500 hover:bg-rose-600 text-white font-mono font-bold text-base tracking-wider flex items-center justify-center space-x-2 shadow-lg transition transform active:scale-95';
        callText.textContent = 'HANG UP';
        badge.textContent = 'CONNECTED (MIC/SPEAKER)';
        badge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-emerald-100 text-emerald-800';
        timer.classList.remove('hidden');
        startTimer();
      }
    }

    function resetCallUIState() {
      isCallActive = false;
      isMuted = false;
      clearInterval(callTimerInterval);
      callSeconds = 0;

      const callBtn = document.getElementById('mainCallBtn');
      const callText = document.getElementById('callBtnText');
      const badge = document.getElementById('callStateBadge');
      const timer = document.getElementById('callTimer');
      const muteBtn = document.getElementById('muteBtn');

      callBtn.className = 'flex-1 max-w-[200px] h-14 sm:h-16 rounded-[16px] bg-emerald-500 hover:bg-emerald-600 text-white font-mono font-bold text-base tracking-wider flex items-center justify-center space-x-2 shadow-green-glow transition transform active:scale-95';
      callText.textContent = 'CALL VOIP';
      badge.textContent = 'SOVEREIGN VOIP READY';
      badge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-slate-200 text-slate-600';
      timer.classList.add('hidden');
      timer.textContent = '00:00';
      muteBtn.className = 'w-14 h-14 rounded-[14px] bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition border border-slate-200';
    }

    function startTimer() {
      clearInterval(callTimerInterval);
      callSeconds = 0;
      const timer = document.getElementById('callTimer');
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        timer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    // Tab Switching
    function switchTab(tab) {
      document.getElementById('tabDialer').classList.add('hidden');
      document.getElementById('tabMessages').classList.add('hidden');
      document.getElementById('tabRecents').classList.add('hidden');

      document.getElementById('navDialer').className = 'flex flex-col items-center py-1 text-slate-400 hover:text-slate-800 transition';
      document.getElementById('navMessages').className = 'flex flex-col items-center py-1 text-slate-400 hover:text-slate-800 transition';
      document.getElementById('navRecents').className = 'flex flex-col items-center py-1 text-slate-400 hover:text-slate-800 transition';

      if (tab === 'dialer') {
        document.getElementById('tabDialer').classList.remove('hidden');
        document.getElementById('navDialer').className = 'flex flex-col items-center py-1 text-rhive-pink font-bold transition';
      } else if (tab === 'messages') {
        document.getElementById('tabMessages').classList.remove('hidden');
        document.getElementById('navMessages').className = 'flex flex-col items-center py-1 text-rhive-pink font-bold transition';
        loadSmsMessages();
      } else if (tab === 'recents') {
        document.getElementById('tabRecents').classList.remove('hidden');
        document.getElementById('navRecents').className = 'flex flex-col items-center py-1 text-rhive-pink font-bold transition';
        loadRecentCalls();
      }
    }

    // Load SMS Messages
    async function loadSmsMessages() {
      const container = document.getElementById('smsThreadContainer');
      try {
        const res = await fetch('/api/mobile/sms');
        const data = await res.json();
        const messages = data.messages || [];
        if (messages.length === 0) {
          container.innerHTML = '<div class="text-center py-6 text-slate-400 font-mono text-[11px]">No SMS messages found in carrier log.</div>';
          return;
        }
        container.innerHTML = messages.map(m => `
          <div class="p-2.5 rounded-[12px] ${m.direction === 'outbound' ? 'bg-pink-50 border border-pink-200 ml-6 text-right' : 'bg-white border border-slate-200 mr-6 text-left'}">
            <div class="flex items-center justify-between text-[10px] font-mono text-slate-400 mb-1">
              <span class="font-bold text-slate-700">${m.direction === 'outbound' ? 'TO: ' + (m.to || '') : 'FROM: ' + (m.from || '')}</span>
              <span>${m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</span>
            </div>
            <div class="text-xs text-slate-900 font-sans">${escapeHtml(m.body || m.text || '')}</div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="text-center py-4 text-rose-500 font-mono text-[11px]">Failed to load SMS: ${err.message}</div>`;
      }
    }

    // Send SMS via JustCall 10DLC pipeline
    async function handleSendSms(e) {
      if (e) e.preventDefault();
      const toInput = document.getElementById('smsToInput');
      const bodyInput = document.getElementById('smsBodyInput');
      const to = toInput.value.trim();
      const body = bodyInput.value.trim();

      if (!to || !body) {
        alert('Please specify recipient and message');
        return;
      }

      try {
        const res = await fetch('/api/mobile/sms/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to, body })
        });
        const data = await res.json();
        if (data.success) {
          bodyInput.value = '';
          loadSmsMessages();
        } else {
          alert('SMS dispatch note: ' + (data.error || 'Check 10DLC delivery'));
        }
      } catch (err) {
        alert('Failed to send SMS: ' + err.message);
      }
    }

    // Load Recent Calls
    async function loadRecentCalls() {
      const container = document.getElementById('recentCallsList');
      try {
        const res = await fetch('/api/mobile/calls');
        const data = await res.json();
        const calls = data.calls || [];
        if (calls.length === 0) {
          container.innerHTML = '<div class="text-center py-6 text-slate-400 font-mono text-[11px]">No recent calls recorded.</div>';
          return;
        }
        container.innerHTML = calls.map(c => `
          <div class="p-2.5 bg-white border border-slate-200 rounded-[12px] flex items-center justify-between hover:border-rhive-pink transition">
            <div class="flex items-center space-x-2">
              <div class="w-7 h-7 rounded-full ${c.direction === 'inbound' ? 'bg-emerald-50 text-emerald-600' : 'bg-pink-50 text-rhive-pink'} flex items-center justify-center">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${c.direction === 'inbound' ? 'M19 14l-7 7m0 0l-7-7m7 7V3' : 'M5 10l7-7m0 0l7 7m-7-7v18'}"/>
                </svg>
              </div>
              <div>
                <div class="font-mono text-xs font-bold text-slate-900">${c.from || c.caller || 'Unknown'}</div>
                <div class="text-[10px] font-mono text-slate-400">${c.direction || 'call'} &bull; ${c.duration || '0'}s &bull; ${c.status || 'completed'}</div>
              </div>
            </div>
            <button onclick="redialNumber('${c.from || c.caller || ''}')" class="px-2.5 py-1 bg-slate-100 hover:bg-black hover:text-white rounded-[8px] text-[10px] font-mono font-bold transition">
              REDIAL
            </button>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="text-center py-4 text-rose-500 font-mono text-[11px]">Failed to load recents: ${err.message}</div>`;
      }
    }

    function redialNumber(num) {
      if (!num) return;
      document.getElementById('dialerInput').value = num;
      switchTab('dialer');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // Auto-boot on load
    window.addEventListener('DOMContentLoaded', () => {
      if (verifyAuthentication()) {
        initTwilioVoice();
      }
    });
  </script>
</body>
</html>
