name: Deploy RHIVE Honey Voice Bridge to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: rhive-quantum-quoter
  REGION: us-central1
  SERVICE_NAME: rhive-voice-live-bridge
  CLOUD_RUN_HOST: rhive-voice-live-bridge-910835773728.us-central1.run.app

jobs:
  deploy-and-verify:
    name: Build, Deploy Warm Cloud Run & Verify Live Honey Audio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_WIF_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy rhive-voice-live-bridge (--min-instances 1, --session-affinity)
        if: ${{ secrets.GCP_WIF_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          source: .
          flags: '--allow-unauthenticated --min-instances=1 --timeout=3600 --session-affinity'
          env_vars: |
            LIVE_VOICE_MODEL=gemini-3.8-live
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Post-Deploy AQuA Synthetic Live Handshake Canary
        if: ${{ secrets.GCP_WIF_PROVIDER != '' || secrets.GCP_SA_KEY != '' }}
        run: |
          curl -fsS -X POST "https://${{ env.CLOUD_RUN_HOST }}/api/telephony/aqua-canary" | tee canary_result.json
          grep -q '"LIVE_VOICE_VERIFIED"' canary_result.json
